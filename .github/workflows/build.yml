name: Build VellorGram APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build VellorGram APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake, ccache and imagemagick
        run: |
          sudo apt-get update && sudo apt-get install -y ccache imagemagick
          yes | sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Generate VellorGram App Icons
        run: |
          magick logo_source.jpg -resize 48x48 TMessagesProj/src/main/res/mipmap-mdpi/ic_launcher.png
          magick logo_source.jpg -resize 48x48 TMessagesProj/src/main/res/mipmap-mdpi/ic_launcher_round.png
          magick logo_source.jpg -resize 72x72 TMessagesProj/src/main/res/mipmap-hdpi/ic_launcher.png
          magick logo_source.jpg -resize 72x72 TMessagesProj/src/main/res/mipmap-hdpi/ic_launcher_round.png
          magick logo_source.jpg -resize 96x96 TMessagesProj/src/main/res/mipmap-xhdpi/ic_launcher.png
          magick logo_source.jpg -resize 96x96 TMessagesProj/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          magick logo_source.jpg -resize 144x144 TMessagesProj/src/main/res/mipmap-xxhdpi/ic_launcher.png
          magick logo_source.jpg -resize 144x144 TMessagesProj/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          magick logo_source.jpg -resize 192x192 TMessagesProj/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          magick logo_source.jpg -resize 192x192 TMessagesProj/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          USE_CCACHE: 1
          NDK_CCACHE: /usr/bin/ccache
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug -PabiList=arm64-v8a --build-cache --parallel --stacktrace

      - name: Upload VellorGram APK
        uses: actions/upload-artifact@v4
        with:
          name: VellorGram-Debug-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
