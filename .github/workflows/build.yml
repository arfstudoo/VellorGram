name: Build VellorGram APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build VellorGram APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      - name: Upload VellorGram APK
        uses: actions/upload-artifact@v4
        with:
          name: VellorGram-Debug-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
